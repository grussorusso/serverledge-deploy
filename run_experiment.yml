- name: Quick benchmark
  hosts: 
    - client
  vars:
    local_results_dir: results
    duration_sec: 30

  tasks:
    - name: Install Locust
      include_role:
        role: locust

    - name: Install serverledge-cli
      include_role:
        role: serverledge
      vars:
        deploy_cli_only: true

    - name: Copy locust dir
      ansible.builtin.copy:
        src: "locust/"
        dest: "."

    - name: Clean previous results
      ansible.builtin.shell: "rm locust-results*"
      ignore_errors: True

    - name: Stop any running Locust instance
      ansible.builtin.shell: "pgrep locust | xargs kill -TERM"
      ignore_errors: True

    - name: Start 
      ansible.builtin.shell: "locust --headless --csv locust-results --json-file locust-results --run-time {{ duration_sec }} -H http://{{ hostvars[groups['edge'][0]]['private_ip'] }}:1323"
      
      async: 900
      poll: 20
      register: locust_out

    - name: Zip Response files
      community.general.archive:
        path:
          - responses/*
        dest: /tmp/responses.tar.gz
        format: gz
        remove: yes
    - name: Copy responses
      ansible.builtin.fetch: 
        src: /tmp/responses.tar.gz
        dest: "{{ local_results_dir }}/responses.tar.gz"
        flat: yes

    - name: Copy results
      ansible.builtin.fetch: 
        src: "{{ item }}"
        dest: "{{ local_results_dir }}/"
        flat: yes
      with_list:
        - "locust-results.json"
        - "locust-results_exceptions.csv"
        - "locust-results_failures.csv"
        - "locust-results_stats.csv"
        - "locust-results_stats_history.csv"


    - debug:
        var: locust_out.stdout_lines

